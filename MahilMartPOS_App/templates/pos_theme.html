{% extends "base.html" %}

{% block style %}
<style>

.theme-wrapper {
    padding: 25px 35px;
}

.theme-title {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary-dark);
}

.theme-card {
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: var(--shadow-sm);
}

/* Theme Mode Toggle */
.mode-toggle {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 22px;
}

.mode-btn {
    border-radius: 20px;
    padding: 8px 22px;
    background: #ececec;
    cursor: pointer;
    border: 1px solid #ccc;
    transition: 0.2s;
}

.mode-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
}

.color-group {
    margin-bottom: 25px;
}

.color-preview {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid #ddd;
    margin-left: 12px;
}

</style>
{% endblock %}


{% block content %}
<div class="page-section form-page">
  <div class="form-wrap">

<div class="theme-wrapper">

    <div class="theme-title">POS Theme Settings</div>

    <div class="theme-card">

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="save_theme">

            <!-- DARK / LIGHT MODE -->
            <div class="mode-toggle">
                <span class="mode-btn {% if settings.mode == 'light' %}active{% endif %}"
                      onclick="setMode('light', event)">Light Mode</span>

                <span class="mode-btn {% if settings.mode == 'dark' %}active{% endif %}"
                      onclick="setMode('dark', event)">Dark Mode</span>

                <input type="hidden" name="theme_mode" id="theme_mode" value="{{ settings.mode }}">
            </div>

            <div class="row">

                <div class="col-md-4 color-group">
                    <label>Primary Color</label>
                    <div class="d-flex align-items-center">
                        <input type="color" class="form-control form-control-color"
                               name="primary_color" value="{{ settings.primary_color }}">
                        <div id="preview_primary" class="color-preview"></div>
                    </div>
                </div>

                <div class="col-md-4 color-group">
                    <label>Sidebar Color</label>
                    <div class="d-flex align-items-center">
                        <input type="color" class="form-control form-control-color"
                               name="sidebar_color" value="{{ settings.sidebar_color }}">
                        <div id="preview_sidebar" class="color-preview"></div>
                    </div>
                </div>

                <div class="col-md-4 color-group">
                    <label>Accent Color</label>
                    <div class="d-flex align-items-center">
                        <input type="color" class="form-control form-control-color"
                               name="accent_color" value="{{ settings.accent_color }}">
                        <div id="preview_accent" class="color-preview"></div>
                    </div>
                </div>

            </div>

            <div class="mt-3 d-flex gap-2">
                <button class="btn btn-primary">Save Theme</button>

                <!-- RESET BUTTON -->
                <button type="button"
                        class="btn btn-outline-secondary"
                        onclick="resetTheme()">
                    Reset to Default
                </button>
            </div>

        </form>
    </div>
</div>


<script>
document.addEventListener("DOMContentLoaded", () => {

    const primaryInput = document.querySelector("input[name='primary_color']");
    const sidebarInput = document.querySelector("input[name='sidebar_color']");
    const accentInput = document.querySelector("input[name='accent_color']");

    function updatePreview() {
        document.getElementById("preview_primary").style.background = primaryInput.value;
        document.getElementById("preview_sidebar").style.background = sidebarInput.value;
        document.getElementById("preview_accent").style.background = accentInput.value;

        // Apply to live layout
        document.documentElement.style.setProperty("--primary", primaryInput.value);
        document.documentElement.style.setProperty("--primary-dark", sidebarInput.value);
        document.documentElement.style.setProperty("--accent", accentInput.value);
    }

    updatePreview();

    primaryInput.addEventListener("input", updatePreview);
    sidebarInput.addEventListener("input", updatePreview);
    accentInput.addEventListener("input", updatePreview);

    /* ---------------- RESET FUNCTION ---------------- */
    window.resetTheme = function () {

        const defaultPrimary = "#2e3b4e";
        const defaultSidebar = "#1f2a38";
        const defaultAccent = "#4a6fa5";

        primaryInput.value = defaultPrimary;
        sidebarInput.value = defaultSidebar;
        accentInput.value = defaultAccent;

        // Reset mode → Light
        const modeHidden = document.getElementById("theme_mode");
        modeHidden.value = "light";

        // UI toggle
        document.querySelectorAll(".mode-btn").forEach(btn => btn.classList.remove("active"));
        document.querySelector(".mode-btn:nth-child(1)").classList.add("active");

        // Apply updated theme
        updatePreview();
        applyLayoutMode("light");
    };
});


/* ----------------- LIGHT / DARK MODE LOGIC ----------------- */

function setMode(mode, event) {

    document.getElementById("theme_mode").value = mode;

    document.querySelectorAll(".mode-btn").forEach(btn =>
        btn.classList.remove("active")
    );

    event.target.classList.add("active");

    applyLayoutMode(mode);
}

/* Unified layout updater */
function applyLayoutMode(mode) {
    const header = document.querySelector(".app-header");
    const sidebar = document.querySelector(".app-sidebar");
    const content = document.querySelector(".app-content");
    const cards = document.querySelectorAll(".card, .theme-card");

    if (!header || !sidebar || !content) return;

    if (mode === "dark") {

        document.documentElement.style.setProperty("--primary-dark", "#0d1117");
        document.documentElement.style.setProperty("--primary", "#1a2634");
        document.documentElement.style.setProperty("--primary-light", "#223042");
        document.documentElement.style.setProperty("--text-light", "#ffffff");
        document.documentElement.style.setProperty("--text-muted", "#c3c3c3");

        document.body.style.background = "#0d1117";
        header.style.background = "#1a2634";
        sidebar.style.background = "#0d1117";
        content.style.background = "#111821";

        cards.forEach(card => {
            card.style.background = "#1f2a33";
            card.style.color = "white";
        });

    } else {

        // Back to saved colors
        document.documentElement.style.setProperty("--primary-dark", "{{ settings.sidebar_color|default:'#1f2a38' }}");
        document.documentElement.style.setProperty("--primary", "{{ settings.primary_color|default:'#2e3b4e' }}");
        document.documentElement.style.setProperty("--primary-light", "#32465a");
        document.documentElement.style.setProperty("--text-light", "#f8f9fa");
        document.documentElement.style.setProperty("--text-muted", "#adb5bd");

        document.body.style.background = "#f5f7fa";
        header.style.background = "{{ settings.primary_color|default:'#2e3b4e' }}";
        sidebar.style.background = "{{ settings.sidebar_color|default:'#1f2a38' }}";
        content.style.background = "#f5f7fa";

        cards.forEach(card => {
            card.style.background = "white";
            card.style.color = "black";
        });
    }
}
</script>


  </div>
</div>
{% endblock %}
